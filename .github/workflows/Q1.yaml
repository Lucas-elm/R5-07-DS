name: Q1 - Archive XYZ

on: [push]

permissions:
  contents: write

jobs:
  archive-xyz:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Copie de XYZ.txt vers Q1_archive_XYZ.txt
        run: cp XYZ.txt Q1_archive_XYZ.txt

      - name: Commit et push
        run: |
          git config --global user.name "Lucas-elm"
          git config --global user.email "lucaselmaknassi@gmail.com"
          git add Q1_archive_XYZ.txt
          git diff --staged --quiet || git commit -m "Q1 : création de Q1_archive_XYZ.txt"
          git push
