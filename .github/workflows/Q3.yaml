name: Q3 - Archive Q3.java

on: [push]

permissions:
  contents: write

jobs:
  archive-q3:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Création de Q3_archive_java.txt
        run: |
          echo "Nom et Prénom : Lucas Elmaknassi" > Q3_archive_java.txt
          echo "--- Contenu de Q3.java ---" >> Q3_archive_java.txt
          cat Q3.java >> Q3_archive_java.txt

      - name: Commit et push
        run: |
          git config --global user.name "Lucas-elm"
          git config --global user.email "lucaselmaknassi@gmail.com"
          git add Q3_archive_java.txt
          git diff --staged --quiet || git commit -m "Q3 : création de Q3_archive_java.txt"
          git pull --rebase
          git push
