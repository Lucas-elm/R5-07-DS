name: Q2 - Archive détaillée XYZ

on: [push]

permissions:
  contents: write

jobs:
  archive-xyz-details:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Création de Q2_archive_XYZ.txt
        run: |
          echo "Nom et Prénom : Lucas El maknassi" > Q2_archive_XYZ.txt
          echo "Date et heure : $(date)" >> Q2_archive_XYZ.txt
          echo "--- Contenu de XYZ.txt ---" >> Q2_archive_XYZ.txt
          cat XYZ.txt >> Q2_archive_XYZ.txt
          echo "" >> Q2_archive_XYZ.txt
          echo "--- Taille de XYZ.txt ---" >> Q2_archive_XYZ.txt
          echo "$(wc -c < XYZ.txt) octets" >> Q2_archive_XYZ.txt

      - name: Commit et push
        run: |
          git config --global user.name "Lucas-elm"
          git config --global user.email "lucaselmaknassi@gmail.com"
          git add Q2_archive_XYZ.txt
          git diff --staged --quiet || git commit -m "Q2 : création de Q2_archive_XYZ.txt"
          git pull --rebase
          git push
